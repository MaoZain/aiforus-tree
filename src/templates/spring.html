<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>封面</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; }
        canvas { display: block; width: 100%; height: 100vh; }
        
        /* Webcam visible bottom-left */
        #webcam { 
            position: absolute; 
            bottom: 20px; 
            left: 20px; 
            width: 160px; 
            height: auto; 
            opacity: 0.7; 
            z-index: 200; 
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 8px;
            transform: scaleX(-1);
        }
        /* Gesture UI Overlay */
        #gesture-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; pointer-events: none; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
            }
        }
    </script>
</head>
<body>
    <div id="card-modal">
        <div class="card-content">
            <p>送给XXX的贺卡</p>
            <button id="enter-btn">进入贺卡</button>
        </div>
    </div>

    <style>
        #card-modal {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border-radius: 15px;
            text-align: center;
            color: white;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 220, 100, 0.2);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            pointer-events: auto; /* 允许交互 */
            user-select: none;
        }

        #card-modal h2 {
            margin: 0 0 15px 0;
            font-weight: 300;
            font-size: 24px;
            color: #d8c1ff;
            text-shadow: 0 0 10px rgba(216, 193, 255, 0.5);
        }

        #card-modal p {
            margin: 0 0 20px 0;
            font-size: 18px;
            color: #eee;
        }

        #enter-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #d8c1ff 0%, #a29bfe 100%);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(162, 155, 254, 0.4);
            transition: all 0.3s ease;
        }

        #enter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(162, 155, 254, 0.6);
        }
    </style>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 绑定按钮事件
        document.getElementById('enter-btn').addEventListener('click', () => {
            window.location.href = './birthday.html';
        });

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.008);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        // 视角调整：15度俯视 (tan(15)*100 ≈ 26.8)
        camera.position.set(0, 18, 100); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const params = {
            count: 21000,     // 减少30% (30000 -> 21000)
            size: 0.8,        
            maxRadius: 100,
            innerRadius: 12,    
            spin: Math.PI * 8, 
            planetSize: 4,     
            coreGlowColor: '#f2be45',
            insideColor: '#f2be45',  
        };

        const pointLight = new THREE.PointLight(0xffffff, 1500, 150);
        scene.add(pointLight);

        const geometryReactive = new THREE.BufferGeometry();
        const posReactive = [], colReactive = [], distsReactive = [], typeReactive = [];

        const colorCore = new THREE.Color(params.coreGlowColor);
        const colorMain = new THREE.Color(params.insideColor);

        // 1. 生成星系粒子
        for (let i = 0; i < params.count; i++) {
            const progress = (Math.random());
            const r = params.innerRadius + Math.pow(progress, 2) * (params.maxRadius - params.innerRadius);

            let px, py, pz, pCol;
            // --- A: 星球近场包裹粒子 ---
// 1. 改变数量：修改 0.99 这个阈值
// 如果改为 0.95，数量会增加 5 倍左右；如果改为 0.995，数量会减少一半。
            
            if (Math.random() > 0.98) { 
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                // 2. 改变分布范围：修改 3.0 这个数值
    // 数值越大，球体周围的粒子云就扩散得越远。
                const dist = params.planetSize + Math.random() * 6.0; 
                px = dist * Math.sin(phi) * Math.cos(theta);
                py = (dist * Math.sin(phi) * Math.sin(theta)) * 0.8; 
                pz = dist * Math.cos(phi);
                pCol = new THREE.Color('#faff72');
            } else {
                if (progress < 0.2 && Math.random() < 0.6) continue;
                const angle = progress * params.spin;
                
                // ★ 修改点 1：调低扩散系数 
                const spreadFactor = 1.4; 
                // ★ 修改点 2：调低随半径增加的额外扩散 
                const spread = spreadFactor * (1 + Math.pow(progress, 2.5) * 15); 
                
                px = Math.cos(angle) * r + (Math.random() - 0.5) * 2 * spread;
                // ★ 修改点 A：压扁垂直厚度 (0.75 -> 0.08) 模拟银河系盘面
                py = (Math.random() - 0.5) * 2 * spread * 0.08; 
                pz = Math.sin(angle) * r + (Math.random() - 0.5) * 2 * spread;
                pCol = progress < 0.10 ? colorCore.clone().lerp(colorMain, progress / 0.10) : colorMain.clone();
            }

            posReactive.push(px, py, pz);
            colReactive.push(pCol.r, pCol.g, pCol.b);
            distsReactive.push(Math.sqrt(px*px + pz*pz)); 
            typeReactive.push(0.0); 
        }

        // 2. 中心球体粒子 (减少 30% -> 28000)
        const sphereParticleCount = 28000; 
        for (let i = 0; i < sphereParticleCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = params.planetSize * Math.pow(Math.random(), 0.5);
            const px = r * Math.sin(phi) * Math.cos(theta);
            const py = r * Math.sin(phi) * Math.sin(theta);
            const pz = r * Math.cos(phi);
            posReactive.push(px, py, pz);
            colReactive.push(1, 1, 1); 
            distsReactive.push(Math.sqrt(px*px + pz*pz));
            typeReactive.push(1.0); 
        }

        geometryReactive.setAttribute('position', new THREE.Float32BufferAttribute(posReactive, 3));
        geometryReactive.setAttribute('color', new THREE.Float32BufferAttribute(colReactive, 3));
        geometryReactive.setAttribute('aDistance', new THREE.Float32BufferAttribute(distsReactive, 1));
        geometryReactive.setAttribute('aType', new THREE.Float32BufferAttribute(typeReactive, 1));

        const vertexShader = `
                attribute float aDistance;
                attribute float aType;
                varying vec3 vColor;
                uniform float uTime;
                uniform float uSize;
                void main() {
                    vColor = color;
                    vec3 pos = position;

                    // 1. 基础波浪与不规则高度
                    if (aType <= 0.5) {
                        float wave = sin(aDistance * 0.2 - uTime * 0.5) * 0.5 + 0.5;
                        // 移除所有律动效果，仅保留基础动画
                    }
                    
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = uSize * (350.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `;
        
        const fragmentShader = `
                varying vec3 vColor;
                void main() {
                    float dist = distance(gl_PointCoord, vec2(0.5));
                    if (dist > 0.5) discard;
                    gl_FragColor = vec4(vColor, 1.0);
                }
            `;

        const materialReactive = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 }, uSize: { value: params.size } },
            vertexShader,
            fragmentShader,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false, 
            vertexColors: true
        });

        const pointsReactive = new THREE.Points(geometryReactive, materialReactive);
        scene.add(pointsReactive);

        const clock = new THREE.Clock();
        let currentRotation = 0;

        function animate() {
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            materialReactive.uniforms.uTime.value = elapsedTime;

            // 1. 衔接旋转：基础旋转速度
            currentRotation += delta * 0.05;
            pointsReactive.rotation.y = currentRotation; 

            // 2. 衔接灯光强度
            pointLight.intensity = 1500;
            
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // --- UI Helper ---
        // Removed Gesture UI Helpers

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            gestureCanvas.width = window.innerWidth;
            gestureCanvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
